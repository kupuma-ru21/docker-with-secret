# https://cloud.google.com/build/docs/build-push-docker-image
# https://cloud.google.com/build/docs/securing-builds/use-secrets

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - -c
      - |
          cat <<EOF > frontend/.env
          VITE_SECRET=$(gcloud secrets versions access "projects/$PROJECT_ID/secrets/$_VITE_SECRET/versions/latest")
          VITE_SECRET2=$(gcloud secrets versions access "projects/$PROJECT_ID/secrets/$_VITE_SECRET2/versions/latest")
          EOF

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/frontend/image',
        './frontend'
      ]

  # Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/frontend/image'
      ]

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      [
        '-c',
        'gcloud run deploy frontend --image us-central1-docker.pkg.dev/$PROJECT_ID/frontend/image --platform managed --region us-central1 --allow-unauthenticated --project $PROJECT_ID'
      ]


options:
  logging: CLOUD_LOGGING_ONLY
