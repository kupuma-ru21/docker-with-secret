# https://cloud.google.com/build/docs/build-push-docker-image
# https://cloud.google.com/build/docs/securing-builds/use-secrets

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - -c
      - |
          SECRET=$(gcloud secrets versions access "projects/$PROJECT_ID/secrets/$_SECRET_NAME/versions/latest")
          echo "SECRET: $$SECRET"
          echo "VITE_SECRET=$(gcloud secrets versions access "projects/$PROJECT_ID/secrets/$_SECRET_NAME/versions/latest")" > frontend/.env.production

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/frontend',
        './frontend'
      ]

options:
  logging: CLOUD_LOGGING_ONLY
